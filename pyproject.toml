[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "individuatenet"
version = "0.1.0"
description = "Learning to Individuate: information-maximising caption generation for zero-shot face enrolment"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
full = [
    "torch>=2.0",
    "open_clip_torch>=2.24",
    "transformers>=4.40",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["individuatenet*"]
