# CelebA regime: dense attributes, image-abundant, primary benchmark.
seed: 0
device: cuda

data:
  name: celeba
  root: data_local/celeba
  attr_file: list_attr_celeba.txt
  identity_file: identity_CelebA.txt
  image_dir: img_align_celeba
  test_frac: 0.5

encoders:
  backbone: ViT-B-32
  pretrained: openai
  offline: true

u:
  backend: torch
  temperature: 0.07
  ridge_lambda: 1.0e-2
  critic_steps: 3000
  critic_lr: 1.0e-3

generator:
  base_lm: gpt2
  prefix_tokens: 16
  context_dim: 512
  lambda_attr: 1.0
  beta_fluency: 0.1
  lr: 1.0e-4
  steps: 8000
  batch_size: 32
  max_new_tokens: 40

eval:
  seeds: [0, 1, 2]
  caption_sources: [attribute, discriminative, rich, generated]
  rank_k: [1, 5, 10]
  bootstrap: 1000

output_dir: results/celeba
