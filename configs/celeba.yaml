# CelebA regime: dense attributes, image-abundant, primary benchmark.
seed: 0
device: cuda

data:
  name: celeba
  root: data_local/celeba
  attr_file: list_attr_celeba.txt
  identity_file: identity_CelebA.txt
  image_dir: img_align_celeba
  test_frac: 0.5

encoders:
  backbone: ViT-B-32-quickgelu
  pretrained: openai
  # false => load real open_clip weights (needs them cached for offline gnodes).
  # Falls back to a hashing encoder only if open_clip/torch import fails.
  # Do NOT set INET_OFFLINE=1 for real runs or you force the hashing fallback.
  offline: false

u:
  backend: torch
  temperature: 0.07
  ridge_lambda: 1.0e-2
  critic_steps: 3000
  critic_lr: 1.0e-3

generator:
  base_lm: gpt2
  prefix_tokens: 16
  context_dim: 512
  lambda_attr: 0.5        # secondary: keep leakage down; identity term dominates
  beta_fluency: 0.5       # per-token KL-to-base anchor (keeps captions fluent)
  attr_bce_cap: 1.0       # bound the leakage penalty -> blocks OOD reward-hacking
  propnoun_weight: 0.3    # penalise confabulated names/places/ages/dates (0 = off)
  ground_weight: 0.7      # reward cos(caption, own face) -> pull toward description (0 = off)
  rep_weight: 0.5         # penalise degenerate repetition / looping (0 = off)
  offtopic_weight: 0.3    # penalise off-topic persona / explicit words (0 = off)
  lr: 1.0e-4
  steps: 8000
  batch_size: 32
  max_new_tokens: 40
  warmup_steps: 300       # supervised prefix-tuning before REINFORCE (fluent init)
  save_every: 500

eval:
  seeds: [0, 1, 2]
  caption_sources: [attribute, discriminative, rich, generated]
  rank_k: [1, 5, 10]
  bootstrap: 1000

output_dir: results/celeba
